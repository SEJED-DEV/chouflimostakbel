<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline - Choufli Mosta9bel</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-alt: #f5f5f7;
        --ink: #1d1d1f;
        --gray: #86868b;
        --gray-2: #6e6e73;
        --blue: #0071e3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 2rem;
        text-align: center;
        letter-spacing: -0.01em;
      }
      .card {
        max-width: 28rem;
      }
      h1 {
        font-size: clamp(1.6rem, 5vw, 2.1rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        color: var(--gray-2);
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1.75rem;
        background: var(--blue);
        color: #fff;
        text-decoration: none;
        border-radius: 999px;
        padding: 0.75rem 1.75rem;
        font-size: 1.0625rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline.</h1>
      <p>
        This page needs a connection. Reconnect and try again &mdash; everything
        you have already read will be waiting.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
